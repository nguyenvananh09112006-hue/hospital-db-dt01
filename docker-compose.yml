services:
  postgres-db:
    image: postgres:18-alpine
    container_name: hospital_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doi_mat_khau_nay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: gắn volume vào /var/lib/postgresql (không phải /var/lib/postgresql/data)
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
